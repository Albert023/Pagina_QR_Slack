<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Bloquea el zoom y escalado en dispositivos moviles/iPad -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slack Colegio Nazareth</title>

    <!-- Coneccion con el archivo de estilos css -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Pantalla 1: Menu Principal -->
    <div id="main-menu" class="container">
        <h1>Canales de Slack</h1>
        <img src="Imagenes/Logo_colegio.png" alt="Logo Colegio" class="school-logo">
        <div class="menu" id="button-container">
            <!-- Los botones se inyectan dinamicamente con JS -->
        </div>
    </div>

    <!-- Pantalla 2: Visualizacion del QR -->
    <div id="qr-screen" class="container qr-view">
        <div class="header-text">COLEGIO NAZARETH</div>
        <div class="title">Canal de Slack</div>
        <h1 id="qr-title" class="grade">Grado</h1>
        <div class="helper-text">Abre la camara de tu celurar y escanea el codigo para unirte</div>
        
        <img id="qr-img" class="qr-image" src="" alt="Codigo QR">
        <tittle>Canal Slack</tittle>
        <h1></h1>
        <button class="btn btn-back" onclick="showMenu()">Volver al Inicio</button>
    </div>
    
    <script>
        const gradosData = [
            { label: 'Parvularia 4', qrUrl: 'Imagenes/QR Slack Parvularia 4.png' },
            { label: 'Parvularia 5', qrUrl: 'Imagenes/QR Slack Parvularia 5.png' },
            { label: 'Parvularia 6', qrUrl: 'Imagenes/QR Slack Parvularia 6.png' },
            { label: 'Primer Grado', qrUrl: 'Imagenes/QR Slack 1° Bachillerato A.png' },
            { label: 'Segundo Grado', qrUrl: 'Imagenes/QR Slack Segundo Grado.png' },
            { label: 'Tercer Grado', qrUrl: 'Imagenes/QR Slack Tercer Grado.png' },
            { label: 'Cuarto Grado', qrUrl: 'Imagenes/QR Slack Cuarto Grado.png' },
            { label: 'Quinto Grado', qrUrl: 'Imagenes/QR Slack Quinto Grado.png' },
            { label: 'Sexto Grado', qrUrl: 'Imagenes/QR Slack Sexto Grado.png' },
            { label: 'Septimo A Grado', qrUrl: 'Imagenes/QR Slack Septimo Grado A.png' },
            { label: 'Septimo B Grado', qrUrl: 'Imagenes/QR Slack Septimo Grado B.png' },
            { label: 'Octavo A Grado', qrUrl: 'Imagenes/QR Slack Octavo Grado A.png' },
            { label: 'Octavo B Grado', qrUrl: 'Imagenes/QR Slack Octavo Grado B.png' },
            { label: 'Noveno A Grado', qrUrl: 'Imagenes/QR Slack Noveno Grado A.png' },
            { label: 'Noveno B Grado', qrUrl: 'Imagenes/QR Slack Noveno Grado B.png' },
            { label: '1 año bachillerato A', qrUrl: 'Imagenes/QR Slack 1° Bachillerato A.png' },
            { label: '1 año bachillerato B', qrUrl: 'Imagenes/QR Slack 1° Bachillerato B.png' },
            { label: '2 año bachillerato A', qrUrl: 'Imagenes/QR Slack 2° Bachillerato A.png' },
            { label: '2 año bachillerato B', qrUrl: 'Imagenes/QR Slack 2° Bachillerato B.png' }


        ];

        // Referencias al DOM
        const mainMenu = document.getElementById('main-menu');
        const qrScreen = document.getElementById('qr-screen');
        const qrTitle = document.getElementById('qr-title');
        const qrImg = document.getElementById('qr-img');
        const buttonContainer = document.getElementById('button-container');

        let inactivityTimer;
        const TIMEOUT_MS = 45000; // Tiempo de inactividad antes de volver al inicio (45 segundos)

        // 1. Generar los botones dinamicamente
        gradosData.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = item.label;
            btn.onclick = () => showQR(item);
            buttonContainer.appendChild(btn);
        });

        // 2. Logica de navegacion
        function showQR(item) {
            mainMenu.style.display = 'none';
            qrScreen.style.display = 'flex';
            qrTitle.innerText = `Canal de Slack: ${item.label}`;
            qrImg.src = item.qrUrl; // Carga la imagen correspondiente
            resetTimer(); // Inicia el conteo regresivo
        }

        function showMenu() {
            qrScreen.style.display = 'none';
            mainMenu.style.display = 'flex';
            qrImg.src = ''; // Limpia el src de la imagen para que no quede en cache visual
            clearTimeout(inactivityTimer); // Detiene el temporizador estando en el menu
        }

        // 3. Logica del temporizador (Event Listener)
        function resetTimer() {
            clearTimeout(inactivityTimer);
            // Solo queremos que el temporizador regrese al inicio si NO estamos ya en el menu
            if (mainMenu.style.display === 'none') {
                inactivityTimer = setTimeout(showMenu, TIMEOUT_MS);
            }
        }

        // Escuchamos cualquier interaccion del usuario para reiniciar el contador.
        // Se usa passive: true para optimizar el rendimiento del scroll/touch.
        ['touchstart', 'mousedown', 'mousemove', 'click'].forEach(evt => 
            document.addEventListener(evt, resetTimer, { passive: true })
        );
    </script>
</body>
</html>
